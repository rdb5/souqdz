<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>التصنيفات · سوق دي زد</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="desktop-shell">
  <div class="content">
    <div class="page">
      <div class="chip-row" id="cat-list"></div>
      <div class="section-title" id="cat-title">كل الإعلانات</div>
      <div class="grid" id="cat-grid"></div>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth, renderShell, renderSidebarInto } from './js/auth.js';
  import { initCategoriesPage } from './js/marketplace.js';
  import { refreshNotifBadge, refreshMsgBadge } from './js/notifications.js';

  const session = requireAuth();
  if (session) {
    renderShell({ activePage: 'categories.html', title: 'التصنيفات' });
    renderSidebarInto(document.querySelector('.desktop-shell'), 'categories.html');
    initCategoriesPage();
    refreshNotifBadge(session.pubHex);
    refreshMsgBadge(session.pubHex);
  }
</script>
</body>
</html>
