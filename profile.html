<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>حسابي · سوق دي زد</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="desktop-shell">
  <div class="content">
    <div class="page">
      <div class="card" style="text-align:center;margin-bottom:16px;">
        <div class="avatar" style="width:74px;height:74px;font-size:1.6rem;margin:0 auto 10px;" id="p-avatar">؟</div>
        <div id="p-name" style="font-weight:900;font-size:1.15rem;"></div>
        <div id="p-npub" class="num" style="font-size:.72rem;color:var(--ink-soft);margin-top:4px;word-break:break-all;"></div>
      </div>

      <div class="grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px;">
        <a href="seller-dashboard.html" class="card" style="text-align:center;">📊<div style="font-weight:700;font-size:.85rem;margin-top:6px;">لوحة البائع</div></a>
        <a href="wallet.html" class="card" style="text-align:center;">⚡<div style="font-weight:700;font-size:.85rem;margin-top:6px;">المحفظة</div></a>
      </div>

      <form id="profile-form" class="card">
        <div class="section-title" style="margin-top:0;">تعديل الملف الشخصي</div>
        <div class="field"><label>الاسم / اسم المتجر</label><input id="f-name" /></div>
        <div class="field"><label>نبذة عنك</label><textarea id="f-about" rows="3"></textarea></div>
        <div class="field"><label>الولاية</label><select id="f-wilaya"></select></div>
        <div class="field"><label>عنوان Lightning للدفع (لُد16) — اختياري</label><input id="f-lud16" placeholder="you@walletofsatoshi.com" /></div>
        <button class="btn btn-primary btn-block" type="submit">حفظ التعديلات</button>
      </form>

      <button id="btn-logout" class="btn btn-outline btn-block" style="margin-top:16px;color:var(--danger);border-color:var(--danger);">🚪 تسجيل الخروج</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth, renderShell, renderSidebarInto, logout } from './js/auth.js';
  import { fetchProfile, publishProfile } from './js/nostr-client.js';
  import { refreshNotifBadge, refreshMsgBadge } from './js/notifications.js';
  import { WILAYAS, toast, initialsOf } from './js/utils.js';

  const session = requireAuth();
  if (session) {
    renderShell({ activePage: 'profile.html', title: 'حسابي' });
    renderSidebarInto(document.querySelector('.desktop-shell'), 'profile.html');
    refreshNotifBadge(session.pubHex);
    refreshMsgBadge(session.pubHex);

    document.querySelector('#f-wilaya').innerHTML = `<option value="">— اختر —</option>` + WILAYAS.map(w=>`<option>${w}</option>`).join('');
    document.querySelector('#p-npub').textContent = session.npub || session.pubHex;

    (async () => {
      const profile = await fetchProfile(session.pubHex) || {};
      document.querySelector('#p-name').textContent = profile.name || 'بائع في سوق دي زد';
      document.querySelector('#p-avatar').textContent = initialsOf(profile.name || 'س ز');
      document.querySelector('#f-name').value = profile.name || '';
      document.querySelector('#f-about').value = profile.about || '';
      document.querySelector('#f-wilaya').value = profile.wilaya || '';
      document.querySelector('#f-lud16').value = profile.lud16 || '';
    })();

    document.querySelector('#profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: document.querySelector('#f-name').value.trim(),
        about: document.querySelector('#f-about').value.trim(),
        wilaya: document.querySelector('#f-wilaya').value,
        lud16: document.querySelector('#f-lud16').value.trim(),
      };
      await publishProfile(data, session.privHex);
      toast('تم حفظ ملفك الشخصي', 'success');
    });

    document.querySelector('#btn-logout').addEventListener('click', () => {
      if (confirm('هل أنت متأكد؟ تأكد من حفظ مفتاحك الخاص أولاً.')) logout();
    });
  }
</script>
</body>
</html>
