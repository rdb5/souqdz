<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - السوق اللامركزي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>سوق الجزائر DZ 🇩🇿</h1>
    </header>
    <div class="container" style="max-width: 400px; text-align: center; margin-top: 100px;">
        <div class="card">
            <h2>تسجيل الدخول بنوستر</h2>
            <p style="margin-bottom: 15px; font-size: 0.9em; color: #666;">أدخل مفتاحك السري (nsec / hex) للدخول. لا يتم حفظ هذا المفتاح في أي سيرفر.</p>
            <input type="password" id="privkey" placeholder="أدخل مفتاح Nostr الخاص بك">
            <button onclick="login()">دخول إلى السوق</button>
        </div>
    </div>

    <script>
        function login() {
            const key = document.getElementById('privkey').value;
            if(key.length > 20) {
                localStorage.setItem('nostr_privkey', key);
                window.location.href = 'index.html';
            } else {
                alert("مفتاح غير صالح!");
            }
        }
    </script>
</body>
</html>
