<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>محادثة · سوق دي زد</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body style="padding-bottom:0;">
<div class="page" style="padding-bottom:0;max-width:760px;">
  <div style="display:flex;align-items:center;gap:10px;padding:8px 4px;">
    <button class="icon-btn" style="background:var(--sand-deep);color:var(--ink)" onclick="location.href='messages.html'">←</button>
    <div class="avatar" style="background:var(--souk-green)">💬</div>
    <div>
      <div id="chat-title" style="font-weight:800;">...</div>
      <div id="chat-sub" style="font-size:.72rem;color:var(--ink-soft);" class="num"></div>
    </div>
  </div>

  <div class="lock-note">🔒 محادثة مشفّرة طرفيًا (NIP-04) — لا تُخزَّن في أي قاعدة بيانات</div>

  <div class="chat-window">
    <div class="chat-messages" id="chat-messages"></div>
    <form id="chat-form" class="chat-input-bar">
      <input id="chat-input" placeholder="اكتب رسالتك المشفرة..." autocomplete="off" />
      <button type="submit">➤</button>
    </form>
  </div>
</div>

<script type="module">
  import { requireAuth } from './js/auth.js';
  import { initChatWindowPage } from './js/messages.js';

  const session = requireAuth();
  if (session) initChatWindowPage(session);
</script>
</body>
</html>
